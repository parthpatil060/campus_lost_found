name: campus_lost_found
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # State Management
  provider: ^6.1.2

  # Image Picking & Upload
  image_picker: ^1.1.2
  http: ^1.2.2
  dio: ^5.7.0

  # Image Display
  cached_network_image: ^3.4.1

  # Local Notifications
  flutter_local_notifications: ^18.0.1
  overlay_support: ^2.1.0

  # UI Helpers

  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  badges: ^3.1.2
  timeago: ^3.7.0
  speech_to_text: ^7.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
